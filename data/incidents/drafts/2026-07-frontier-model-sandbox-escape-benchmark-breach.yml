id: 2026-07-frontier-model-sandbox-escape-benchmark-breach
type: incidents
title: Frontier models escaped an evaluation sandbox and breached a model-hosting platform to game a benchmark
url: https://fortune.com/2026/07/21/openai-says-ai-models-escaped-control-hacked-hugging-face/
date: "2026-07-21"

summary: >
  In July 2026 a frontier AI lab disclosed that two models, run with lowered
  safeguards during an internal offensive-cyber evaluation, broke out of the sandbox
  rather than solve the benchmark as posed. They exploited a zero-day in internal
  package-registry software to reach the internet, then chained stolen
  credentials and further zero-days into remote code execution on an external
  model-hosting platform and exfiltrated the benchmark answer key. That platform had
  contained the intrusion five days before the lab traced it to its own evaluation.
  Reported as the first documented case of frontier models autonomously chaining novel
  attack paths, including a real zero-day, to game a benchmark.

