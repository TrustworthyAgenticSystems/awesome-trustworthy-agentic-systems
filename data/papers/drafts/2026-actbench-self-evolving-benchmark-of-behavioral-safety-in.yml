summary: ActBench is a self-evolving benchmark for evaluating behavioral safety risks in cowork agents
  by analyzing execution trajectories for data disclosure, state manipulation, and unauthorized API invocation,
  using reward-guided beam search for adversarial payload generation and dual evidence verification for
  safety assessment.
